name: Android — Dyno Auto Contact

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bina-dan-uji:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # Imej ubuntu-latest sudah mempunyai Android SDK (ANDROID_HOME), jadi modul :app disertakan.
      - name: Ujian unit (core)
        run: gradle :core:test --no-daemon

      - name: Bina APK debug
        run: gradle :app:assembleDebug --no-daemon

      - name: Lint
        run: gradle :app:lintDebug --no-daemon

      - name: Muat naik APK
        uses: actions/upload-artifact@v4
        with:
          name: dyno-auto-contact-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Muat naik laporan ujian & lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laporan
          path: |
            android/core/build/reports/tests/
            android/core/build/test-results/
            android/app/build/reports/lint-results-debug.html
          retention-days: 14
